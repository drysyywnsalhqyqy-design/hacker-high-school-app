name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Capacitor & Sync Android
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            if [ -f index.html ]; then
              cp index.html www/index.html
            elif [ -f www/www/index.html ]; then
              cp www/www/index.html www/index.html
            else
              find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" -exec cp {} www/index.html \; -quit
            fi
          fi
          ls -la www
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "مدرسة الهاكر الثانوية" "com.hackerhighschool.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackerHighSchool-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
